# Extractive QA as in the PHEE paper (EEQA): BioBERT v1.1, triggers from a word tagger
# (first word of every trigger labelled with its event type), the authors' question
# templates, argument stages trained on gold inputs, at most 2 answers per question
# above the no-answer score (authors' code).
inherit: ../base.yaml
method: eqa
templates: authors
train_inputs: gold
trigger_mode: tagger
model:
  name: dmis-lab/biobert-base-cased-v1.1
  max_length: 384
  stride: 128
answers:
  main: {max_answer_length: 30, max_spans: 2, use_null: true, null_threshold: 0.0}
  sub: {max_answer_length: 30, max_spans: 2, use_null: true, null_threshold: 0.0}
training:
  learning_rate: 5.0e-5
  batch_size: 16
stage_training:
  trigger: {learning_rate: 1.0e-5, batch_size: 32}
