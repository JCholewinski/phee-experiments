# Own extractive QA pipeline: event type classifier -> trigger QA -> main-argument QA
# -> sub-argument QA. Same encoder and training settings as the baseline (BioBERT v1.1,
# lr 5e-5, batch 16), so that the difference comes from the construction of the method.
inherit: ../base.yaml
method: eqa
templates: current
train_inputs: predicted
trigger_mode: question   # event type classifier + one trigger question per type
model:
  name: dmis-lab/biobert-base-cased-v1.1
  max_length: 384
  stride: 128
event_type: {threshold: 0.5, force_one: true, max_length: 256}
# Answers read exactly as in the baseline (the authors' rule, max. 30 tokens), so that the
# difference comes only from the three changes: triggers (classifier + trigger question),
# own templates, argument stages trained on predicted inputs. The trigger question uses
# the same rule, with at least one answer (the classifier already found the event).
answers:
  trigger: {max_answer_length: 8, max_spans: 2, selection: authors, min_spans: 1}
  main: {max_answer_length: 30, max_spans: 2, selection: authors}
  sub: {max_answer_length: 30, max_spans: 2, selection: authors}
training:
  learning_rate: 5.0e-5
  batch_size: 16
