# Own generative QA: own target format and stage-2 questions, stage 2 trained on the
# predictions of stage 1, constrained decoding. Same model and training settings as the
# baseline (SciFive-base-PMC, lr 5e-4 / 5e-5, effective batch 16, beam 3), so that the
# difference comes from the construction of the method.
inherit: ../base.yaml
method: gqa
target_format: own
templates: current
train_inputs: predicted
decodings: [free, constrained]  # constrained decoding is applied to the same trained models
model:
  name: razent/SciFive-base-PMC
generation:
  num_beams: 3
  max_source_length: 512
  max_target_length: 256
  stage1_max_new_tokens: 256
  stage2_max_new_tokens: 64
  max_span_words: 80
training:
  batch_size: 8
  grad_accum: 2
  eval_batch_size: 32
stage_training:
  stage1: {learning_rate: 5.0e-4}
  stage2: {learning_rate: 5.0e-5}
