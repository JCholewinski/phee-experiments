# Sequence labeling as in the PHEE paper (approximation, see README):
# one model, main argument + sub-argument flattened into combined IO tags,
# multi-event sentences duplicated per event, CRF layer with learned transitions
# (the authors' final ACE system used a CRF), BioBERT v1.1, lr 5e-5, batch 32 (the
# authors' fine-tuning settings). Not reproduced: ACE's concatenation of two models.
inherit: ../base.yaml
method: seq
scheme: authors_flat
model:
  name: dmis-lab/biobert-base-cased-v1.1
  head: crf
  crf_constrained: false        # IO tags: no BIO constraints exist
  dropout: 0.1
  max_length: 512
training:
  learning_rate: 5.0e-5
  batch_size: 32
  crf_learning_rate: 1.0e-3     # transition scores start at 0 and need a larger step
decodings: [viterbi]            # best tag sequence with the learned transitions
