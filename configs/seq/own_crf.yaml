# Improved sequence labeling (main plan):
#  * CRF with learned transitions and the BIO constraints (forbidden transitions) in
#    training and decoding;
#  * events: a trigger tagger, then main-argument and sub-argument taggers run once per
#    predicted trigger, on the sentence with that trigger marked [TRG] ... [/TRG]
#    (MAILEX, Srivastava et al. 2023). The marker carries no event type; the type comes
#    from the trigger tagger;
#  * the argument taggers are trained on the triggers the trigger tagger predicts on the
#    training sentences (each matched to the nearest gold event of its type; no match:
#    an example without arguments), as the extractive / generative QA improved versions
#    are trained on predicted inputs; early stopping also on predicted dev triggers;
#  * at least one trigger per sentence (every PHEE sentence has an event).
inherit: own_base.yaml
scheme: per_trigger
train_inputs: predicted
min_triggers: 1
model:
  head: crf
training:
  crf_learning_rate: 1.0e-3     # transition scores start at 0 and need a larger step
decodings: [viterbi]
