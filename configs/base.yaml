# Settings shared by every experiment (overridden by the experiment configs).
data:
  dir: data/phee2/processed     # output of scripts/prepare_data.py
  limit: null                   # e.g. 50 for a quick test

training:                       # common procedure (phee/training.py)
  max_epochs: 20
  patience: 2                   # stop after 2 evaluations without improvement
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  precision: bf16               # bf16 autocast on GPU
  eval_batch_size: 64
  log_every: 50
