# Zero-shot and few-shot extraction with a local open-weight LLM (no fine-tuning).
inherit: ../base.yaml
method: llm
shots: [0, 5]                   # demonstrations selected from train with BM25
demonstrations: per_type        # as Sun et al. (2024): 5 most similar sentences with an ADE
                                # + 5 with a PTE, the same for both prompts
max_new_tokens: 1024
splits: [dev, test]
model:
  backend: vllm
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  chat_template_kwargs: {}
